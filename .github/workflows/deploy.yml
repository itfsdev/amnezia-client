name: GCC12 test (Linux only)
'on':
  push:
    branches:
    - '**'
    tags:
    - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
jobs:
  Detect-Changes:
    runs-on: ubuntu-latest
    outputs:
      recipes_changed: ${{ steps.filter.outputs.recipes }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: "recipes:\n  - 'recipes/**'\n  - 'conanfile.py'\n  - '.github/workflows/deploy.yml'\n  - 'cmake/conan_provider.cmake'\n  - 'cmake/platform_settings.cmake'\n  - 'cmake/recipes_bootstrap.cmake'\n"
  Bake-Prebuilts-Linux:
    runs-on: ubuntu-22.04
    needs:
    - Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10
    - uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Install conan
      run: pip install "conan==2.28.0"
    - name: Use GCC 12
      run: 'echo "CC=gcc-12" >> "$GITHUB_ENV"

        echo "CXX=g++-12" >> "$GITHUB_ENV"

        '
    - name: Build dependencies
      shell: bash
      run: "for build_type in Release Debug; do\n  cmake -S . -B build -DPREBUILTS_ONLY=1 \"-DCMAKE_BUILD_TYPE=$build_type\"\ndone\n"
    - name: Authorize in remote
      if: github.ref == 'refs/heads/dev'
      run: conan remote login amnezia "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"
    - name: Upload baked prebuilts
      if: github.ref == 'refs/heads/dev'
      run: conan upload -r amnezia "*" -c
  Build-Linux-Ubuntu:
    runs-on: ubuntu-22.04
    needs:
    - Bake-Prebuilts-Linux
    if: ${{ always() }}
    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7
      PROD_AGW_PUBLIC_KEY_B64: ${{ secrets.PROD_AGW_PUBLIC_KEY_B64 }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      SANDBOX_AGW_PUBLIC_KEY_B64: ${{ secrets.SANDBOX_AGW_PUBLIC_KEY_B64 }}
      SANDBOX_AGW_ENDPOINT: ${{ secrets.SANDBOX_AGW_ENDPOINT }}
      SANDBOX_S3_ENDPOINT: ${{ secrets.SANDBOX_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}
    steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: linux
        target: desktop
        arch: linux_gcc_64
        modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: tools_ifw
        set-env: 'true'
        aqtversion: ==3.3.0
        py7zrversion: ==0.22.*
        extra: --base ${{ env.QT_MIRROR }}
    - name: Setup python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Install conan
      run: pip install "conan==2.28.0"
    - name: Install system packages
      run: sudo apt-get install libxkbcommon-x11-0 libsecret-1-dev
    - name: Use GCC 12
      run: 'echo "CC=gcc-12" >> "$GITHUB_ENV"

        echo "CXX=g++-12" >> "$GITHUB_ENV"

        '
    - name: Get sources
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10
    - name: Build project
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        AMNEZIA_BUILD_TESTS: true
      run: deploy/build.sh --generator Ninja --installer all
    - name: Upload Linux test build
      uses: actions/upload-artifact@v7
      with:
        name: linux-build
        path: deploy/build/client/tests
        retention-days: 7
    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_linux_x64.run
        archive: false
        retention-days: 7
    - name: Upload translations artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN_translations
        path: client/translations
        retention-days: 7
